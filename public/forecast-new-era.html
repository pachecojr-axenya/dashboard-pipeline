<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forecast New Era | Axenya</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.15rem}
.hdr-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text2);border-radius:99px;cursor:pointer;transition:background .15s,color .15s;position:relative;flex-shrink:0}
.hdr-btn:hover{background:rgba(255,255,255,0.13);color:var(--text)}
html[data-theme="light"] .hdr-btn:hover{background:rgba(0,0,0,0.07)}
.hdr-btn.highlighted{background:var(--teal)!important;color:#fff!important;box-shadow:0 0 0 2px rgba(58,184,183,.3)}
.hdr-btn[data-tooltip]::after{content:attr(data-tooltip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);font-size:.73rem;padding:.26rem .62rem;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:300}
.hdr-btn[data-tooltip]:hover::after{opacity:1}
.hdr-actions{display:flex;align-items:center;background:rgba(255,255,255,0.09);border-radius:99px;padding:7px;gap:12px}
html[data-theme="light"] .hdr-actions{background:rgba(0,0,0,0.03)}
@keyframes hdr-spin{to{transform:rotate(360deg)}}
.hdr-btn.spinning svg{animation:hdr-spin .7s linear infinite}
.nav-drawer{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--card);border-right:1px solid rgba(255,255,255,.08);z-index:1000;transition:left .25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column}
.nav-drawer.open{left:0}
.nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease}
.nav-backdrop.open{opacity:1;pointer-events:auto}
.nav-drawer-footer{margin-top:auto;display:flex;align-items:center;gap:.5rem;padding:.7rem .75rem;border-top:1px solid rgba(255,255,255,.08)}
html[data-theme="light"] .nav-drawer-footer{border-top-color:rgba(0,0,0,.1)}
.nav-foot-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:38px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;padding:.4rem;font-family:inherit;font-size:.78rem;font-weight:700;letter-spacing:.04em;transition:border-color .15s,color .15s,background .15s}
.nav-foot-btn:hover{border-color:var(--teal);color:var(--text)}
.novo-hdr{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 2rem;background:transparent;position:sticky;top:0;z-index:100;transition:background .25s,backdrop-filter .25s,box-shadow .25s}
.novo-hdr.scrolled{background:var(--hdr-glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1px 0 var(--border)}
.novo-theme-sun{display:block}.novo-theme-moon{display:none}
[data-theme="light"] .novo-theme-sun{display:none}[data-theme="light"] .novo-theme-moon{display:block}
.novo-card{background:var(--pm-card-bg,var(--card));border-radius:16px;padding:1.35rem 1.55rem}
.novo-card-header{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.novo-card-header h3{font-size:.9rem;font-weight:600;color:var(--text);margin:0;flex:1}
table.lb{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.lb th{text-align:right;color:var(--teal);font-size:.72rem;font-weight:700;text-transform:uppercase;padding:.6rem 1rem;border-bottom:2px solid var(--teal);white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.lb th:first-child{text-align:left}
table.lb td{padding:.5rem 1rem;border-bottom:1px solid var(--border);color:var(--text);text-align:right}
table.lb td:first-child{text-align:left;font-weight:600}
table.lb tbody tr:nth-child(even) td{background:var(--even-s)}
table.lb tbody tr:hover td{background:var(--hover-s)}
#view-novo{transition:filter .25s ease,margin-left .25s cubic-bezier(0.4,0,0.2,1)}
body.nav-docked #view-novo{margin-left:280px}
@media(max-width:820px){body.nav-docked #view-novo{margin-left:0}}
.content-blur{filter:blur(4px);pointer-events:none;user-select:none}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
.sarr{color:var(--teal);font-size:.7rem;margin-left:.2rem}
a.deal-link{color:var(--teal);text-decoration:none;font-weight:700;display:flex;align-items:center;gap:.3rem;overflow:hidden}
a.deal-link:hover{text-decoration:underline}
a.deal-link .dl-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.deal-link .ext-icon{flex-shrink:0;font-size:.75rem;opacity:0;transition:opacity .12s;color:var(--teal)}
a.deal-link:hover .ext-icon{opacity:1}
.prob-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}
.prob-overlay.open{opacity:1;pointer-events:auto}
.deal-modal-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:min(560px,94vw);max-height:88vh;overflow-y:auto;background:var(--card);border-radius:14px;padding:1.6rem 1.8rem 1.8rem;box-shadow:0 24px 64px rgba(0,0,0,.45);opacity:0;transition:opacity .22s,transform .22s cubic-bezier(0.4,0,0.2,1)}
.prob-overlay.open .deal-modal-box{opacity:1;transform:translate(-50%,-50%) scale(1)}
.deal-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.3rem}
.deal-modal-title{font-size:1.25rem;font-weight:700;color:var(--text);line-height:1.25;margin-top:.1rem}
.deal-modal-sub{font-size:.84rem;color:var(--text);margin-top:.45rem}
.deal-modal-exec{font-size:.82rem;color:var(--text2);margin-top:.32rem}
.deal-modal-list{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.deal-row{display:flex;align-items:baseline;justify-content:space-between;gap:.8rem;padding:.5rem .25rem;border-radius:8px;border-bottom:1px solid var(--border);transition:background .14s,transform .14s cubic-bezier(0.4,0,0.2,1),box-shadow .14s}
.deal-row:hover{background:var(--card2,var(--hover));transform:scale(1.045);box-shadow:0 6px 20px rgba(0,0,0,.32);border-bottom-color:transparent;position:relative;z-index:3}
.deal-row:hover .dr-lbl{color:var(--text)}
.deal-row:hover .dr-val{color:var(--text);font-weight:700}
.deal-row .dr-lbl{color:var(--text2);font-size:.8rem;font-weight:500;flex-shrink:0}
.deal-row .dr-val{color:var(--text);font-size:.86rem;font-weight:500;text-align:right;word-break:break-word;min-width:0}
@media(max-width:560px){.deal-modal-list{grid-template-columns:1fr}}
.deal-modal-nav{display:flex;align-items:center;gap:.35rem;flex-shrink:0}
.dm-nav-count{font-size:.72rem;color:var(--text2);min-width:52px;text-align:center;user-select:none}
.dm-nav-btn{width:30px;height:30px;border:none;border-radius:7px;cursor:pointer;background:var(--card2);color:var(--text);font-size:1.05rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.dm-nav-btn:hover{background:var(--hover)}
.dm-close{background:none;color:var(--text2)}
.dm-close:hover{color:var(--text)}
.deal-modal-foot{display:flex;justify-content:flex-end;gap:.7rem;margin-top:1.6rem}
.btn-hubspot{display:inline-flex;align-items:center;gap:.5rem;background:#ff7a59;color:#fff;border:none;border-radius:8px;padding:.62rem 1.15rem;font-size:.88rem;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;transition:opacity .15s,transform .12s}
.btn-hubspot:hover{opacity:.9;transform:translateY(-1px)}
</style>
<link rel="stylesheet" href="/premium.css?v=5">
<script src="/premium.js?v=6"></script>
<script src="/ax-ui.js?v=1"></script>
</head>
<body>

<nav class="nav-drawer" id="nav-drawer"></nav>
<div class="nav-backdrop" id="nav-backdrop" onclick="closeDrawer()"></div>

<div id="view-novo">
  <div class="novo-hdr" id="novo-hdr">
    <div style="display:flex;align-items:center;gap:.75rem">
      <button class="hdr-btn" onclick="toggleDrawer()" data-tooltip="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="panel-switcher" id="panel-switcher"><button class="panel-switch-btn" type="button" onclick="togglePanelMenu(event)" aria-haspopup="true" aria-expanded="false"><h1>Forecast New Era</h1><svg class="panel-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button><div class="panel-dd" id="panel-dd" role="menu"></div></div>
    </div>
    <div class="hdr-actions">
      <button class="hdr-btn highlighted" id="btn-refresh" onclick="neLoadData()" data-tooltip="Atualizar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    </div>
  </div>
  <div id="novo-content" style="max-width:1200px;margin:0 auto;padding:2rem">
    <div class="ax-empty ax-empty-lg">Aguardando dados…</div>
  </div>
</div>

<div class="prob-overlay" id="deal-overlay" onclick="if(event.target===this)closeDealModal()">
  <div class="deal-modal-box" id="deal-modal-box"></div>
</div>

<script>
(function(){ var s=localStorage.getItem('axenya_theme')||'dark'; if(s==='light') document.documentElement.setAttribute('data-theme','light'); })();
function toggleTheme(){ var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('axenya_theme',n); }
function doLogout(){ window.location.href='/login.html'; }
function setContentBlur(on){ document.getElementById('view-novo').classList.toggle('content-blur',on); }
function _setNavOpen(open){ document.getElementById('nav-drawer').classList.toggle('open',open); document.body.classList.toggle('nav-docked',open); var narrow=window.matchMedia('(max-width:820px)').matches; document.getElementById('nav-backdrop').classList.toggle('open',open&&narrow); try{localStorage.setItem('novo_nav_open',open?'true':'false');}catch(e){} }
function closeDrawer(){ _setNavOpen(false); }
function toggleDrawer(){ _setNavOpen(!document.getElementById('nav-drawer').classList.contains('open')); }
window.addEventListener('scroll',function(){ document.getElementById('novo-hdr').classList.toggle('scrolled',window.scrollY>10); },{passive:true});

var _ne=function(s){ return (s==null?'—':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
function _neDate(iso){ if(!iso) return '—'; var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?(m[3]+'/'+m[2]+'/'+m[1]):'—'; }
function _neDias(n){ return (n==null||isNaN(n))?'—':(n+'d'); }

function _neHsUrl(d){ return d.id ? 'https://app.hubspot.com/contacts/44715285/deal/'+d.id : null; }

function _neRows(deals){
  return deals.map(function(d,i){
    var hsUrl=_neHsUrl(d);
    var nameCell='<a class="deal-link" href="javascript:void(0)" onclick="openDealModal('+i+')" title="Ver detalhes de '+_ne(d.dealname)+'"><span class="dl-txt">'+_ne(d.dealname)+'</span><span class="ext-icon">›</span></a>';
    return '<tr>' +
      '<td style="min-width:200px;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+nameCell+'</td>' +
      '<td style="text-align:left;white-space:nowrap">'+_ne(d.etapa)+'</td>' +
      '<td style="text-align:left;white-space:nowrap">'+_ne(d.executivo)+'</td>' +
      '<td>'+_neDias(d.dias_no_pipe)+'</td>' +
      '<td>'+_neDate(d.createdate)+'</td>' +
      '</tr>';
  }).join('');
}

// ── Ordenação de colunas ─────────────────────────────────────────────────
var NE_COLS=[
  {k:'dealname',lbl:'Deal',type:'text',align:'left'},
  {k:'etapa',lbl:'Etapa',type:'text',align:'left'},
  {k:'executivo',lbl:'Executivo',type:'text',align:'left'},
  {k:'dias_no_pipe',lbl:'Dias no Pipe',type:'num',align:'right'},
  {k:'createdate',lbl:'Data de Criação',type:'date',align:'right'}
];
var sortKey='dias_no_pipe', sortDir=-1;
function neSortBy(key){
  if(sortKey===key) sortDir*=-1;
  else { sortKey=key; sortDir=(key==='dias_no_pipe')?-1:1; }
  neApplyAndRender();
}
function _neColByKey(k){ for(var i=0;i<NE_COLS.length;i++) if(NE_COLS[i].k===k) return NE_COLS[i]; return NE_COLS[0]; }
function _neCmp(a,b){
  var col=_neColByKey(sortKey), av=a[sortKey], bv=b[sortKey];
  if(col.type==='num'){ av=(av==null?-Infinity:av); bv=(bv==null?-Infinity:bv); return (av-bv)*sortDir; }
  if(col.type==='date'){ av=av||''; bv=bv||''; return (av<bv?-1:(av>bv?1:0))*sortDir; }
  av=(av==null?'':String(av)).toLowerCase(); bv=(bv==null?'':String(bv)).toLowerCase();
  return av.localeCompare(bv,'pt-BR')*sortDir;
}
function _neHeaderRow(){
  return NE_COLS.map(function(c){
    var arr=sortKey===c.k?'<span class="sarr">'+(sortDir>0?'▲':'▼')+'</span>':'';
    return '<th class="sortable" style="text-align:'+c.align+'" onclick="neSortBy(\''+c.k+'\')">'+c.lbl+arr+'</th>';
  }).join('');
}
var _neSorted=[];
function neApplyAndRender(){
  _neSorted=(_neDeals||[]).slice().sort(_neCmp);
  var wrap=document.getElementById('ne-table-wrap');
  if(wrap) wrap.innerHTML='<table class="lb"><thead><tr>'+_neHeaderRow()+'</tr></thead><tbody>'+_neRows(_neSorted)+'</tbody></table>';
}

// ── Modal de detalhe do deal (com navegação ‹ › e teclado ← →/Esc) ──────
var currentDealIndex=-1;
function openDealModal(di){
  if(di==null||di<0||di>=_neSorted.length) return;
  currentDealIndex=di;
  renderDealModal();
  document.getElementById('deal-overlay').classList.add('open');
}
function navDealModal(delta){
  var n=_neSorted.length; if(!n) return;
  currentDealIndex=(currentDealIndex+delta+n)%n;
  renderDealModal();
  var box=document.getElementById('deal-modal-box'); if(box) box.scrollTop=0;
}
function closeDealModal(){
  var ov=document.getElementById('deal-overlay'); if(ov) ov.classList.remove('open');
}
function renderDealModal(){
  var di=currentDealIndex, d=_neSorted[di]; if(!d) return;
  var total=_neSorted.length;
  var hsUrl=_neHsUrl(d);
  var titleHtml=hsUrl
    ? '<a href="'+hsUrl+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">'+_ne(d.dealname)+'</a>'
    : _ne(d.dealname);
  var body='<div class="deal-modal-head">'+
    '<div style="min-width:0;">'+
      '<div class="deal-modal-title">'+titleHtml+'</div>'+
      '<div class="deal-modal-sub">'+_ne(d.etapa)+'</div>'+
      '<div class="deal-modal-exec">'+_ne(d.executivo)+'</div>'+
    '</div>'+
    '<div class="deal-modal-nav">'+
      '<button class="dm-nav-btn" onclick="navDealModal(-1)" title="Deal anterior (←)">‹</button>'+
      '<span class="dm-nav-count">'+(di+1)+' / '+total+'</span>'+
      '<button class="dm-nav-btn" onclick="navDealModal(1)" title="Próximo deal (→)">›</button>'+
      '<button class="dm-nav-btn dm-close" onclick="closeDealModal()" title="Fechar (Esc)">✕</button>'+
    '</div>'+
  '</div>';
  var cell=function(lbl,val){ return '<div class="deal-row"><span class="dr-lbl">'+lbl+'</span><span class="dr-val">'+val+'</span></div>'; };
  body+='<div class="deal-modal-list">';
  body+=cell('Etapa',_ne(d.etapa));
  body+=cell('Executivo',_ne(d.executivo));
  body+=cell('Dias no Pipe',_neDias(d.dias_no_pipe));
  body+=cell('Data de Criação',_neDate(d.createdate));
  body+='</div>';
  if(hsUrl){
    body+='<div class="deal-modal-foot"><a class="btn-hubspot" href="'+hsUrl+'" target="_blank" rel="noopener">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>'+
      'Abrir deal no HubSpot</a></div>';
  }
  document.getElementById('deal-modal-box').innerHTML=body;
}
document.addEventListener('keydown', function(e){
  var ov=document.getElementById('deal-overlay');
  var dealOpen=ov && ov.classList.contains('open');
  if(e.key==='Escape'){ closeDealModal(); }
  else if(dealOpen && e.key==='ArrowLeft'){ e.preventDefault(); navDealModal(-1); }
  else if(dealOpen && e.key==='ArrowRight'){ e.preventDefault(); navDealModal(1); }
});

var _neDeals=null;
function neLoadData(){
  var btn=document.getElementById('btn-refresh'); if(btn) btn.classList.add('spinning');
  document.getElementById('novo-content').innerHTML='<div style="text-align:center;padding:3rem 0;color:var(--text2)">Buscando dados…</div>';
  fetch('/api/forecast-new-era').then(function(r){
    if(!r.ok) return r.text().then(function(txt){ throw new Error(txt||('HTTP '+r.status)); });
    return r.json();
  }).then(function(res){
    if(btn) btn.classList.remove('spinning');
    if(!res || res.success===false) throw new Error((res&&res.error)||'Falha ao buscar dados');
    _neDeals=res.deals||[];
    neRender(res);
  }).catch(function(err){
    if(btn) btn.classList.remove('spinning');
    document.getElementById('novo-content').innerHTML=AxUI.banner('Erro: '+_ne(String(err&&err.message||err)), { severity:'error', retry:'neLoadData()', retryLabel:'Tentar novamente' });
  });
}

function neRender(res){
  var deals=_neDeals||[];
  var ts=new Date().toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
  var body=document.getElementById('novo-content');

  if(!deals.length){
    body.innerHTML=
      '<div style="font-size:.78rem;color:var(--text2);margin-bottom:1rem">Atualizado às '+ts+' | pipeline New Era ('+_ne(res.pipeline_id)+') | <span style="font-weight:700">🟡 painel novo, sem cálculo de receita ainda</span></div>'+
      AxUI.emptyState('Nenhum deal encontrado no pipeline New Era.', { size:'lg' });
    return;
  }

  body.innerHTML=
    '<div style="font-size:.78rem;color:var(--text2);margin-bottom:1rem">Atualizado às '+ts+' | '+deals.length+' deals | pipeline New Era ('+_ne(res.pipeline_id)+') | <span style="font-weight:700">🟡 painel novo, sem cálculo de receita ainda</span></div>'+
    '<div class="novo-card">'+
      '<div class="novo-card-header"><h3>Deals | New Era</h3></div>'+
      '<div style="overflow-x:auto" id="ne-table-wrap"></div>'+
    '</div>';
  neApplyAndRender();
}

(function(){
  try{ if(localStorage.getItem('novo_nav_open')==='true') _setNavOpen(true); }catch(e){}
  neLoadData();
})();
</script>
<script src="/nav.js?v=7"></script>
</body>
</html>
