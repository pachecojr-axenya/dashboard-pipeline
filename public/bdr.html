<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#171f2e;--card2:#1e2a3c;--border:#293a50;--text:#e6edf3;--text2:#8b949e;--muted:#6e7681;--teal:#3ab8b7;--green:#3fb950;--red:#f85149;--orange:#d29922;--yellow:#e3b341;--hover:rgba(255,255,255,0.06);--even-s:#131b28;--hover-s:#1c2b40;--hdr-glass:rgba(13,17,23,.78)}
html[data-theme="light"]{--bg:#f6f8fa;--card:#ffffff;--card2:#eaeef2;--border:#d0d7de;--text:#1f2328;--text2:#57606a;--teal:#0d7377;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--hover:rgba(0,0,0,0.05);--even-s:#f1f4f8;--hover-s:#e8eef4;--hdr-glass:rgba(246,248,250,.82)}
body{background:var(--bg);color:var(--text);font-family:Inter,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.15rem}
.hdr-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text2);border-radius:99px;cursor:pointer;transition:background .15s,color .15s;position:relative;flex-shrink:0}
.hdr-btn:hover{background:rgba(255,255,255,0.13);color:var(--text)}
html[data-theme="light"] .hdr-btn:hover{background:rgba(0,0,0,0.07)}
.hdr-btn.highlighted{background:var(--teal)!important;color:#fff!important;box-shadow:0 0 0 2px rgba(58,184,183,.3)}
.hdr-btn[data-tooltip]::after{content:attr(data-tooltip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);font-size:.73rem;padding:.26rem .62rem;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:300}
.hdr-btn[data-tooltip]:hover::after{opacity:1}
.hdr-sep{width:1px;height:16px;background:rgba(255,255,255,0.12);margin:0 2px;flex-shrink:0}
html[data-theme="light"] .hdr-sep{background:rgba(0,0,0,0.12)}
.hdr-actions{display:flex;align-items:center;background:rgba(255,255,255,0.09);border-radius:99px;padding:7px;gap:12px}
html[data-theme="light"] .hdr-actions{background:rgba(0,0,0,0.03)}
@keyframes hdr-spin{to{transform:rotate(360deg)}}
.hdr-btn.spinning svg{animation:hdr-spin .7s linear infinite}
/* Settings drawer global */
.gs-toggle{display:inline-flex;align-items:center;cursor:pointer;background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:.3rem;flex:none}
.gs-sw{width:34px;height:19px;border-radius:99px;background:var(--border);position:relative;transition:background .18s;flex:none}
.gs-toggle.on .gs-sw{background:var(--teal)}
.gs-sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .18s}
.gs-toggle.on .gs-sw::after{transform:translateX(15px)}
.gs-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s}
.gs-backdrop.open{opacity:1;pointer-events:auto}
.gs-drawer{position:fixed;top:0;right:-380px;width:360px;max-width:100vw;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:3001;display:flex;flex-direction:column;transition:right .28s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 32px rgba(0,0,0,.25)}
.gs-drawer.open{right:0}
.gs-hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.gs-hdr h3{margin:0;font-size:1.2rem;font-weight:600;color:var(--text)}
.gs-body{flex:1;overflow-y:auto;padding:1rem 1.5rem}
.gs-row{display:flex;align-items:center;gap:.75rem;padding:.85rem 0;border-bottom:1px solid var(--border)}
.gs-row label{flex:1;font-size:.9rem;color:var(--text)}
.nav-drawer{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--card);border-right:1px solid rgba(255,255,255,.08);z-index:1000;transition:left .25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column}
.nav-drawer.open{left:0}
.nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease}
.nav-backdrop.open{opacity:1;pointer-events:auto}
.nav-drawer-header{display:flex;align-items:center;gap:.75rem;padding:1.1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08)}
.nav-drawer-brand{font-weight:600;font-size:1rem;color:var(--text);flex:1}
.nav-drawer-footer{margin-top:auto;display:flex;align-items:center;gap:.5rem;padding:.7rem .75rem;border-top:1px solid rgba(255,255,255,.08)}
html[data-theme="light"] .nav-drawer-footer{border-top-color:rgba(0,0,0,.1)}
.nav-foot-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:38px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;padding:.4rem;font-family:inherit;font-size:.78rem;font-weight:700;letter-spacing:.04em;transition:border-color .15s,color .15s,background .15s}
.nav-foot-btn:hover{border-color:var(--teal);color:var(--text)}
.nav-menu{list-style:none;padding:.5rem 0;margin:0}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;cursor:pointer;font-size:.9rem;color:var(--text2);transition:background .15s,color .15s}.nav-item.nav-sub{padding-left:2.7rem;font-size:.8rem;gap:.55rem}.nav-item.nav-sub svg{width:14px;height:14px}.nav-menu.nav-group-collapsed .nav-item.nav-sub{display:none}.nav-acc-chevron{margin-left:auto;display:inline-flex;align-items:center;padding:2px;color:var(--text2);transition:transform .18s;border-radius:4px}.nav-acc-chevron:hover{background:rgba(35,209,180,.15);color:var(--teal)}.nav-acc-chevron.open{transform:rotate(180deg)}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
.nav-item.active{color:var(--teal);font-weight:500}
.nav-item.active svg{stroke:var(--teal)}
.novo-hdr{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 2rem;background:transparent;position:sticky;top:0;z-index:100;transition:background .25s,backdrop-filter .25s,box-shadow .25s}
.novo-hdr.scrolled{background:var(--hdr-glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1px 0 var(--border)}
.novo-theme-sun{display:block}.novo-theme-moon{display:none}
[data-theme="light"] .novo-theme-sun{display:none}[data-theme="light"] .novo-theme-moon{display:block}
.novo-lang-btn{width:auto !important;padding:0 9px;font-size:.71rem;font-weight:700;letter-spacing:.06em}
.novo-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:1rem;padding-bottom:2rem}
.novo-card{background:var(--card);border-radius:10px;padding:1.25rem 1.5rem}
.novo-card-header{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.novo-card-header h3{font-size:.88rem;font-weight:600;color:var(--text);margin:0;flex:1}
.novo-code-tag{display:none;align-items:center;font-size:.6rem;font-weight:700;letter-spacing:.04em;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--teal);background:rgba(58,184,183,.14);border:1px solid rgba(58,184,183,.32);border-radius:5px;padding:.05rem .32rem;line-height:1.35;flex-shrink:0}
.novo-info-btn{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text2);background:none;color:var(--text2);font-size:.62rem;font-style:normal;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:0;line-height:1}
body:not(.novo-info-on) .novo-card .novo-info-btn{display:none}
body.novo-info-on .novo-code-tag{display:inline-flex}
#novo-tip{position:fixed;z-index:9999;background:rgba(23,31,46,.78);backdrop-filter:blur(14px) saturate(1.5);border-radius:6px;padding:.45rem .7rem;width:278px;pointer-events:none;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
html[data-theme="light"] #novo-tip{background:rgba(246,248,250,.82)}
#novo-tip.nt-show{display:block}
#novo-tip .nt-text{font-size:.73rem;color:var(--text);font-weight:400;line-height:1.5}
#novo-tip .nt-code{font-size:.62rem;font-weight:700;color:var(--teal);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:.3rem;padding-top:.28rem;border-top:1px solid rgba(255,255,255,.12);letter-spacing:.07em}
html[data-theme="light"] #novo-tip .nt-code{border-top-color:rgba(0,0,0,.1)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:.75rem}
.tab-sub{display:inline-flex;background:var(--card2);border-radius:99px;padding:3px;gap:0;position:relative}
.tab-sub-btn{background:transparent;border:none;border-radius:99px;color:var(--text2);padding:.3rem .9rem;cursor:pointer;font-size:.75rem;font-weight:500;transition:color .18s;position:relative;z-index:1}
.tab-sub-btn.active{color:var(--text);font-weight:600}
html[data-theme="light"] .tab-sub-btn.active{box-shadow:none}
.tab-sub-thumb{position:absolute;top:3px;height:calc(100% - 6px);border-radius:99px;background:rgba(255,255,255,.14);pointer-events:none;z-index:0;transition:left .22s cubic-bezier(.4,0,.2,1),width .22s cubic-bezier(.4,0,.2,1)}
html[data-theme="light"] .tab-sub-thumb{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.bdr-fbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.75rem}
.bdr-fbar-lbl{font-size:.72rem;color:var(--text2);font-weight:700;margin-right:.25rem}
.bdr-fchip{background:var(--card2);border:1px solid var(--border);border-radius:99px;color:var(--text2);padding:.25rem .7rem;cursor:pointer;font-size:.72rem;font-weight:600;font-family:inherit;transition:all .15s}
.bdr-fchip:hover{border-color:var(--teal);color:var(--text)}
.bdr-fchip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.kpi-card{background:var(--card);border-radius:14px;padding:clamp(1rem,.6rem+1.3vw,1.6rem) clamp(1.05rem,.5rem+1.6vw,1.8rem)}
.kpi-click{cursor:pointer}
.kpi-label{font-size:.66rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;line-height:1}
.kpi-value{font-size:clamp(1.35rem,.95rem+1.3vw,2rem);font-weight:800;line-height:1.1;margin:.35rem 0 .25rem}
.kpi-sub{font-size:.7rem;color:var(--muted);line-height:1.35}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s linear;backdrop-filter:blur(5px)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:90vw;max-width:960px;max-height:85vh;display:flex;flex-direction:column;transform:translateY(20px);transition:transform .28s cubic-bezier(0.4,0,0.2,1)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.5rem;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1rem;font-weight:600;color:var(--text)}
.modal-close{background:none;border:none;color:var(--text2);font-size:1.4rem;cursor:pointer;padding:.2rem .5rem;border-radius:4px}
.modal-close:hover{color:var(--red)}
.modal-body{padding:1.2rem 1.5rem;overflow-y:auto;flex:1}
.btn-export{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:.3rem .7rem;font-size:.7rem;cursor:pointer;margin-left:auto}
.btn-export:hover{border-color:var(--teal);color:var(--teal)}
table.lb{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.lb th{text-align:right;color:var(--teal);font-size:.72rem;font-weight:700;text-transform:uppercase;padding:.6rem 1rem;border-bottom:2px solid var(--teal);white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.lb th:first-child{text-align:left}
table.lb td{padding:.38rem 1rem;border-bottom:1px solid var(--border);color:var(--text);text-align:right}
table.lb td:first-child{text-align:left;font-weight:600}
table.lb tbody tr:nth-child(even) td{background:var(--even-s)}
table.lb tbody tr:hover td{background:var(--hover-s)}
#view-novo{transition:filter .25s ease,margin-left .25s cubic-bezier(0.4,0,0.2,1)}
body.nav-docked #view-novo{margin-left:280px}
@media(max-width:820px){body.nav-docked #view-novo{margin-left:0}}
.content-blur{filter:blur(4px);pointer-events:none;user-select:none}
.novo-help-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s ease}
.novo-help-backdrop.open{opacity:1;pointer-events:auto}
.novo-help-drawer{position:fixed;top:0;right:-580px;width:540px;max-width:100vw;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:3001;display:flex;flex-direction:column;transition:right .28s cubic-bezier(0.4,0,0.2,1);box-shadow:-8px 0 32px rgba(0,0,0,.25)}
.novo-help-drawer.open{right:0}
.novo-help-hdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0}
.novo-help-hdr h3{margin:0;font-size:1.15rem;font-weight:600;color:var(--text)}
.novo-help-body{flex:1;overflow-y:auto;padding:1.25rem 1.5rem}
.section-hdr{grid-column:1/-1;margin:1.5rem 0 .25rem;border-top:1px solid var(--border);padding-top:1.25rem}
.section-hdr h2{font-size:.78rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin:0}
.banner-warn{grid-column:1/-1;background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.3);border-radius:10px;padding:1rem 1.25rem;margin-bottom:.25rem;font-size:.82rem;color:var(--orange)}
</style>

function _mlbl(ym){ var p=ym.split('-'); return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(p[1])-1]+'/'+p[0].slice(2); }
function _annualRev(d){ if(d.arr_estimado!=null&&d.arr_estimado>0)return d.arr_estimado; if(d.primeira_fatura!=null&&d.primeira_fatura>0)return d.primeira_fatura*12; return 0; }
function _rawDeals(){ return window._novoDealsRaw || _novoDeals || []; }
function _filterState(){ return (window.AxFilter && AxFilter.getState) ? AxFilter.getState() : {mode:'all',start:null,end:null}; }
function _inWinStrict(dateStr){ var s=_filterState(); if(!s.start)return true; if(!dateStr)return false; return AxFilter.inWin(dateStr); }
function _dealsByDate(field){ return _rawDeals().filter(function(d){ return _inWinStrict(d[field]); }); }
function _isBdr(d){ return !!d.sdr; }
// Originação do BDR é medida pela data de ENTRADA em Reunião Agendada (evento real de "BDR
// marcou a reunião"), NÃO por createdate (distorcido por importações em massa). Deals sem essa
// data (ex.: perdidos sem histórico da etapa) ficam de fora das séries de originação.
var BDR_ORIG_DATE='data_reuniao_agendada';
function _origDate(d){ return d[BDR_ORIG_DATE]||null; }
function _oym(d){ var x=_origDate(d); return x?x.substring(0,7):null; }
function _origDeals(){ return _dealsByDate(BDR_ORIG_DATE).filter(_origDate); }
// Janela dos KPIs de originação do topo (R01/R02): segue o filtro de período quando
// há um ativo; sem filtro, cai no MÊS CORRENTE (comportamento padrão histórico).
// Retorna { start, end, label, filtered } com start/end em YYYY-MM (inclusivos).
function _bdrKpiWindow(){
  var s=_filterState();
  if(s&&s.start&&s.end){
    var a=s.start.substring(0,7), b=s.end.substring(0,7);
    return { start:a, end:b, label:(s.label||(a===b?_mlbl(a):(_mlbl(a)+' → '+_mlbl(b)))), filtered:true };
  }
  var _n=new Date(); var ym=_n.getFullYear()+'-'+String(_n.getMonth()+1).padStart(2,'0');
  return { start:ym, end:ym, label:_mlbl(ym), filtered:false };
}
// Deals originados pelo time de BDRs dentro da janela dos KPIs (por entrada em RA).
// Usa exatamente o mesmo critério de janela dos gráficos (_inWinStrict, nível dia)
// para garantir que o big number reconcilie com a soma das quebras abaixo. Sem
// filtro ativo, restringe ao mês corrente (comportamento padrão histórico).
function _bdrKpiOrigDeals(){
  var w=_bdrKpiWindow();
  if(w.filtered){
    return _origDeals().filter(_isTeamBdr);
  }
  return _rawDeals().filter(function(d){ if(!_isTeamBdr(d))return false; var ym=_oym(d); return ym===w.start; });
}

// ── Time de BDRs (fonte única: window.BDR_LIST, o drawer de Configurações) ─────
// O nome no HubSpot (campo sdr) às vezes difere do drawer; BDR_HS_ALIAS mapeia as
// grafias conhecidas do HubSpot → nome canônico do drawer (verificado nos dados em
// 2026-07-02). Acentos são tolerados via normalização NFD (ex.: Cíntia → Cintia).
var BDR_HS_ALIAS={
  'gabriele de almeida silva':'Gabriele Almeida',
  'bruna cristina dos reis silva':'Bruna Reis',
  'giovana rocha':'Giovana Nunes',
};
function _bdrNorm(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
// Resolve uma string de nome (sdr OU ae) para o nome canônico do time, ou null.
function _teamBdrByName(s){
  if(!s) return null;
  var n=_bdrNorm(BDR_HS_ALIAS[_bdrNorm(s)]||s);
  var list=window.BDR_LIST||[];
  for(var i=0;i<list.length;i++){ if(_bdrNorm(list[i].name)===n) return list[i].name; }
  return null;
}
function _teamBdrName(d){ return _teamBdrByName(_bdrName(d)); }
function _isTeamBdr(d){
  var n=_teamBdrName(d);
  if(!n) return false;
  return _bdrIsActive(n,_oym(d));
}

// ── REGRA DE VIGÊNCIA DO TIME + META (decisão do dono, 2026-08-03) ──────────────
// A partir de 2026-08, Anderson Souza, Cintia Rodrigues, Thauan Pontes e
// Yokyko Muramoto deixam o time ATIVO de BDRs desta página (BDR Performance).
//   • A vigência é determinada pelo MÊS DE ORIGINAÇÃO do deal (entrada em
//     Reunião Agendada, campo data_reuniao_agendada) — e, na seção de cadência,
//     pelo mês de CRIAÇÃO do contato. Antes do corte o histórico continua
//     contando normalmente (13 BDRs); a partir do corte os saídos não pertencem
//     mais ao time (some das abas, totais, handoff e metas).
//   • META: a partir do corte, TODO BDR ativo tem meta fixa de 16 reuniões/mês
//     (reunião = deal com entrada em Reunião Agendada — a régua de elegibilidade
//     de colaboradores ≥ 30 continua valendo no realizado). Metas mensais
//     cadastradas continuam valendo para meses ANTERIORES ao corte; para o
//     período ativo a constante BDR_GOAL_ACTIVE vence (16 para todos, sem
//     diferenciação por BDR). BDRs saídos não têm meta no período ativo.
//   • Implementação: condicional por mês (não remoção definitiva do roster) —
//     filtros e metas consultam _bdrIsActive/_bdrGoalForMonth, que decidem pela
//     data. Nenhuma tabela/constante do roster global foi alterada; outras
//     páginas (workload, no-show, treble) seguem com o roster completo.
var BDR_TEAM_EFFECTIVE_FROM='2026-08';   // YYYY-MM do corte (mês atual na decisão)
var BDR_TEAM_EXITED=['Anderson Souza','Cintia Rodrigues','Thauan Pontes','Yokyko Muramoto'];
var BDR_GOAL_ACTIVE=16;                  // meta padrão (reuniões/mês) p/ BDR ativo no corte+
var _bdrExitedSet={}; BDR_TEAM_EXITED.forEach(function(n){_bdrExitedSet[n]=1;});
function _bdrIsExited(name){ return !!_bdrExitedSet[name]; }
function _bdrCurrentYm(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
function _bdrNextYm(ym){ var y=parseInt(ym.substring(0,4),10), m=parseInt(ym.substring(5,7),10); m++; if(m>12){m=1;y++;} return y+'-'+String(m).padStart(2,'0'); }
// BDR é ATIVO no mês ym (YYYY-MM)? ym null/ausente (deal/contato sem data) = assume
// o mês corrente — regra ativa. Saídos contam só até o mês anterior ao corte.
// Formato inválido (não YYYY-MM) também cai no mês corrente para nunca classificar errado.
function _bdrIsActive(name, ym){
  if(!_bdrIsExited(name)) return true;
  if(!ym || !/^\d{4}-\d{2}$/.test(ym)) ym=_bdrCurrentYm();
  return ym < BDR_TEAM_EFFECTIVE_FROM;

function bdrMetasSave(){
  var inputs=document.querySelectorAll('#modal-body input[data-bdr]');

  var y=_bdrMetasYear;

  var bad=null;
  inputs.forEach(function(inp){
    if(inp.disabled) return; // células fixas pela REGRA DE VIGÊNCIA não são editáveis
    var raw=inp.value.trim(); if(raw==='') return;

    if(isNaN(v)||v<0){ bad=inp.getAttribute('data-bdr')+' ('+inp.getAttribute('data-ym')+')'; return; }

    }).catch(function(e){ alert('Falha ao salvar: '+e); if(btn){btn.disabled=false;btn.textContent='Salvar (global)';} });

function buildBdrOrigin(){
  // R12: APENAS o time de BDRs ATIVO (via _isTeamBdr, com vigência por mês de
  // originação); rótulo = nome canônico.
  var th=_novoTheme(), created=_origDeals().filter(_isTeamBdr);
  var colab=_bdrOriginMode==='colaboradores';
  var vidas=_bdrOriginMode==='vidas';
  var byCanal=_bdrOriginDim!=='bdr';
    var dimFnOrig=_dimFnDeal(_bdrOriginDim);
  var inc=function(d){ return vidas?(d.vidas||0):colab?(d.colaboradores||0):1; };
  // Eixo Y é SEMPRE por BDR (não troca ao ligar "Por Canal" — o que muda é a cor da
  // barra: Por BDR = barra sólida colorida pela meta; Por Canal = barra EMPILHADA por
  // canal (origem__originacao_), mostrando o share de cada canal dentro do BDR).
  var aggDeals={}, aggVidas={}, aggColab={}, aggGoalDeals={};
  created.forEach(function(d){
    var b=_teamBdrName(d);
    aggDeals[b]=(aggDeals[b]||0)+1;
    aggVidas[b]=(aggVidas[b]||0)+(d.vidas||0);
    aggColab[b]=(aggColab[b]||0)+(d.colaboradores||0);
    if(_bdrCountsForGoal(d)) aggGoalDeals[b]=(aggGoalDeals[b]||0)+1;
  });
  var agg=colab?aggColab:vidas?aggVidas:aggDeals;
  var ranked=Object.keys(agg).map(function(b){return {bdr:b,n:agg[b]};}).filter(function(r){return r.n>0;}).sort(function(a,b){return b.n-a.n;}).slice(0,15);
  // Meta por BDR = _bdrGoalFor (metas MENSAIS da janela do filtro; fallback na flat legada).
  var bdrInfo={};
  ranked.forEach(function(r){
    var level=null;
    (window.BDR_LIST||[]).forEach(function(b){ if(b.name===r.bdr) level=b.level; });
    bdrInfo[r.bdr]={goal:_bdrGoalFor(r.bdr),level:level};
  });
  var canvas=document.getElementById('chart-bdr-origin-bdr');
  if(canvas) canvas.style.height=Math.max(ranked.length*36+48,160)+'px';

  if(byCanal){
    // ── Por Canal: barra empilhada horizontal, uma linha por BDR, um segmento por
    // canal (origem__originacao_) — mostra o SHARE de cada canal dentro do BDR.
    // Sem colapso em "Outros" (mesmo padrão do Weekly/Monthly R13/R14): todo canal
    // que aparece ganha segmento próprio; "(sem origem)" é um canal como outro.
    var canais={};
    created.forEach(function(d){ var c=dimFnOrig(d); canais[c]=(canais[c]||0)+inc(d); });

// REGRA DE VIGÊNCIA (2026-08-03): BDRs que saíram do time a partir de 2026-08 só

function bdrOpenAttainmentModal(label){

}

// R07: APENAS deals ORIGINADOS pelo time de BDRs (mesma base 665 do R12: sdr do time +
// data de entrada em Reunião Agendada preenchida) — inclusive nas saídas (ganhos/perdidos).
// Rótulos (datalabels) visíveis por padrão.
function buildBdrNetFlow(){
  var _origTeam=function(d){ return _isTeamBdr(d)&&_origDate(d); };
  var th=_novoTheme(), months=_getMonths(12), created=_origDeals().filter(_isTeamBdr), won=_novoWon().filter(_origTeam), lost=_novoLost().filter(_origTeam);
  var inflow=months.map(function(m){return created.filter(function(d){return _oym(d)===m;}).length;});
  var wonOut=months.map(function(m){return won.filter(function(d){return d.close_date&&d.close_date.substring(0,7)===m;}).length;});
  var lostOut=months.map(function(m){return lost.filter(function(d){return d.close_date&&d.close_date.substring(0,7)===m;}).length;});
  var net=inflow.map(function(v,i){return v-wonOut[i]-lostOut[i];});
  var _dl={display:function(c){return !!c.dataset.data[c.dataIndex];},color:th.cText,font:{family:NOVO_FONT,size:9,weight:'bold'},formatter:function(v){return v?_ni(Math.abs(v)):'';}};
  _novoMkChart('chart-bdr-net-flow',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:months.map(_mlbl),datasets:[
      {label:'Entrada (Reunião Agendada)',data:inflow,backgroundColor:'rgba(58,184,183,.75)',borderRadius:2,stack:'s',datalabels:Object.assign({anchor:'end',align:'top'},_dl)},
      {label:'Saída (ganhos)',data:wonOut.map(function(v){return -v;}),backgroundColor:'rgba(63,185,80,.65)',borderRadius:2,stack:'s',datalabels:Object.assign({anchor:'end',align:'bottom'},_dl)},
      {label:'Saída (perdidos)',data:lostOut.map(function(v){return -v;}),backgroundColor:'rgba(248,81,73,.65)',borderRadius:2,stack:'s',datalabels:Object.assign({anchor:'end',align:'bottom'},_dl)},
      {type:'line',label:'Net',data:net,borderColor:'rgba(227,179,65,.9)',backgroundColor:'rgba(227,179,65,.15)',pointRadius:3,borderWidth:2,tension:0.3,fill:false,stack:undefined,datalabels:{display:false}}
    ]},
    options:{responsive:true,layout:{padding:{top:24,bottom:16}},plugins:{legend:{display:true,labels:{color:th.cText2,font:{family:NOVO_FONT,size:10},padding:8}},tooltip:{mode:'index',intersect:false}},
      scales:{x:{grid:{display:false},ticks:{color:th.cText2,font:{family:NOVO_FONT}},stacked:true},y:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT},precision:0},stacked:true}},
      onClick:function(e,el){ if(!el.length)return; var idx=el[0].datasetIndex; var pre=idx===1?'Ganho':(idx===2?'Perdido':null); bdrOpenFacetModal('Fluxo de Pipeline | BDR', _rawDeals().filter(_origTeam), 'desfecho', pre); }}});
}

// R08: APENAS deals ORIGINADOS pelo time de BDRs (mesma base 665 do R12), inclusive nas
// saídas; métrica = COLABORADORES (não vidas, a pedido do CRO 2026-07-02); rótulos visíveis.
function buildBdrNetVidas(){
  var _origTeam=function(d){ return _isTeamBdr(d)&&_origDate(d); };
  var th=_novoTheme(), months=_getMonths(12), created=_origDeals().filter(_isTeamBdr), won=_novoWon().filter(_origTeam), lost=_novoLost().filter(_origTeam);
  var colabOf=function(d){ return d.colaboradores||0; };
  var inflow=months.map(function(m){return created.filter(function(d){return _oym(d)===m;}).reduce(function(s,d){return s+colabOf(d);},0);});
  var wonOut=months.map(function(m){return won.filter(function(d){return d.close_date&&d.close_date.substring(0,7)===m;}).reduce(function(s,d){return s+colabOf(d);},0);});
  var lostOut=months.map(function(m){return lost.filter(function(d){return d.close_date&&d.close_date.substring(0,7)===m;}).reduce(function(s,d){return s+colabOf(d);},0);});
  var net=inflow.map(function(v,i){return v-wonOut[i]-lostOut[i];});
  var _dl={display:function(c){return !!c.dataset.data[c.dataIndex];},color:th.cText,font:{family:NOVO_FONT,size:9,weight:'bold'},formatter:function(v){return v?_ni(Math.abs(v)):'';}};
  _novoMkChart('chart-bdr-net-vidas',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:months.map(_mlbl),datasets:[
      {label:'Entrada (colaboradores)',data:inflow,backgroundColor:'rgba(58,184,183,.75)',borderRadius:2,stack:'s',datalabels:Object.assign({anchor:'end',align:'top'},_dl)},
      {label:'Saída (ganhos)',data:wonOut.map(function(v){return -v;}),backgroundColor:'rgba(63,185,80,.65)',borderRadius:2,stack:'s',datalabels:Object.assign({anchor:'end',align:'bottom'},_dl)},
      {label:'Saída (perdidos)',data:lostOut.map(function(v){return -v;}),backgroundColor:'rgba(248,81,73,.65)',borderRadius:2,stack:'s',datalabels:Object.assign({anchor:'end',align:'bottom'},_dl)},
      {type:'line',label:'Net Colaboradores',data:net,borderColor:'rgba(227,179,65,.9)',backgroundColor:'rgba(227,179,65,.15)',pointRadius:3,borderWidth:2,tension:0.3,fill:false,stack:undefined,datalabels:{display:false}}
    ]},
    options:{responsive:true,layout:{padding:{top:24,bottom:16}},plugins:{legend:{display:true,labels:{color:th.cText2,font:{family:NOVO_FONT,size:10},padding:8}},tooltip:{mode:'index',intersect:false}},
      scales:{x:{grid:{display:false},ticks:{color:th.cText2,font:{family:NOVO_FONT}},stacked:true},y:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT}},stacked:true}},
      onClick:function(e,el){ if(!el.length)return; var idx=el[0].datasetIndex; var pre=idx===1?'Ganho':(idx===2?'Perdido':null); bdrOpenFacetModal('Fluxo de Colaboradores | BDR', _rawDeals().filter(_origTeam), 'desfecho', pre); }}});
}

// R09: média de COLABORADORES por deal (não vidas, a pedido do CRO 2026-07-02), APENAS o
// time de BDRs. Números no padrão brasileiro (ponto milhar, vírgula decimal).
function buildBdrAvgVidas(){
  var th=_novoTheme(), months=_getMonths(12), all=_origDeals().filter(_isTeamBdr);
  var avgs=months.map(function(m){ var ds=all.filter(function(d){return _oym(d)===m&&d.colaboradores!=null;}); if(!ds.length)return null; var avg=ds.reduce(function(s,d){return s+(d.colaboradores||0);},0)/ds.length; return Math.round(avg*10)/10; });
  var _fmtAvg=function(v){ return v==null?'':v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:1}); };
  _novoMkChart('chart-bdr-avg-vidas',{type:'line',plugins:[ChartDataLabels],

    options:{responsive:true,layout:{padding:{top:28}},plugins:{legend:{display:false},
      datalabels:{anchor:'end',align:'top',color:th.cText,font:{family:NOVO_FONT,size:10,weight:'bold'},formatter:_fmtAvg,display:function(ctx){return ctx.dataset.data[ctx.dataIndex]!=null;}},
      tooltip:{callbacks:{label:function(c){return c.parsed.y!=null?(_fmtAvg(c.parsed.y)+' colaboradores/deal'):'sem dados';}}}},
      scales:{x:{grid:{display:false},ticks:{color:th.cText2,font:{family:NOVO_FONT}}},y:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT},callback:function(v){return Number(v).toLocaleString('pt-BR');}},beginAtZero:true}},

// R10: donut fatiado por BDR do TIME (uma fatia por BDR com originação no período, a pedido
// do CRO 2026-07-02). Centro = total de deals originados pelo time.
function buildBdrColabs(){
  var th=_novoTheme(), all=_origDeals().filter(_isTeamBdr);
  var byB={}; all.forEach(function(d){ var b=_teamBdrName(d); byB[b]=(byB[b]||0)+1; });
  var names=Object.keys(byB).sort(function(a,b){return byB[b]-byB[a];});
  var data=names.map(function(n){return byB[n];});
  var total=all.length;
  var palette=['rgba(58,184,183,.9)','rgba(88,166,255,.85)','rgba(147,112,219,.85)','rgba(63,185,80,.8)','rgba(210,153,34,.85)','rgba(248,81,73,.75)','rgba(227,179,65,.85)','rgba(247,129,102,.8)','rgba(110,190,255,.8)','rgba(180,140,255,.8)','rgba(120,200,160,.8)','rgba(255,170,90,.8)','rgba(160,170,190,.8)'];
  var centerPlugin={id:'bdrColabsCenter',afterDraw:function(chart){ var area=chart.chartArea; if(!area)return; var ctx=chart.ctx,cx=(area.left+area.right)/2,cy=(area.top+area.bottom)/2; ctx.save();ctx.textAlign='center';ctx.textBaseline='middle'; ctx.fillStyle=th.cText;ctx.font='700 27px '+NOVO_FONT;ctx.fillText(total.toLocaleString('pt-BR'),cx,cy-7); ctx.fillStyle=th.cText2;ctx.font='600 10px '+NOVO_FONT;ctx.fillText('reuniões agendadas',cx,cy+15); ctx.restore(); }};
  _novoMkChart('chart-bdr-colabs',{type:'doughnut',plugins:[ChartDataLabels,centerPlugin],
    data:{labels:names,datasets:[{data:data,backgroundColor:names.map(function(n,i){return palette[i%palette.length];}),borderColor:'var(--card)',borderWidth:3,borderRadius:6,spacing:2,hoverOffset:10}]},
    options:{responsive:true,cutout:'68%',layout:{padding:6},plugins:{
      legend:{display:true,position:'right',labels:{color:th.cText2,font:{family:NOVO_FONT,size:10},padding:6,usePointStyle:true,boxWidth:8,boxHeight:8}},
      datalabels:{color:'#fff',font:{family:NOVO_FONT,size:10,weight:'bold'},formatter:function(v){var pct=total?Math.round(v/total*100):0;return pct>=4?pct+'%':'';}},
      tooltip:{callbacks:{label:function(c){var pct=total?Math.round(c.parsed/total*100):0; return c.label+': '+_ni(c.parsed)+' deals ('+pct+'%)';},footer:function(){return 'Clique para ver os deals';}}}},
      onClick:function(e,el){ if(!el.length)return; var b=names[el[0].index]; bdrOpenFacetModal('Originação por BDR', all, 'bdr', b); }}});
}

function buildBdrSizeDist(){
  // R11: APENAS deals originados pelo time de BDRs. Modo Colaboradores usa o campo
  // colaboradores; modo Vidas usa vidas (nunca misturar).
  var th=_novoTheme(), all=_origDeals().filter(_isTeamBdr);
