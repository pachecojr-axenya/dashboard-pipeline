*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#171f2e;--card2:#1e2a3c;--border:#293a50;--text:#e6edf3;--text2:#8b949e;--muted:#6e7681;--teal:#3ab8b7;--green:#3fb950;--red:#f85149;--orange:#d29922;--yellow:#e3b341;--hover:rgba(255,255,255,0.06);--even-s:#131b28;--hover-s:#1c2b40;--hdr-glass:rgba(13,17,23,.78)}
html[data-theme="light"]{--bg:#f6f8fa;--card:#ffffff;--card2:#eaeef2;--border:#d0d7de;--text:#1f2328;--text2:#57606a;--teal:#0d7377;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e;--hover:rgba(0,0,0,0.05);--even-s:#f1f4f8;--hover-s:#e8eef4;--hdr-glass:rgba(246,248,250,.82)}
body{background:var(--bg);color:var(--text);font-family:Inter,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.15rem}
.hdr-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text2);border-radius:99px;cursor:pointer;transition:background .15s,color .15s;position:relative;flex-shrink:0}
.hdr-btn:hover{background:rgba(255,255,255,0.13);color:var(--text)}
html[data-theme="light"] .hdr-btn:hover{background:rgba(0,0,0,0.07)}
.hdr-btn.highlighted{background:var(--teal)!important;color:#fff!important;box-shadow:0 0 0 2px rgba(58,184,183,.3)}
.hdr-btn[data-tooltip]::after{content:attr(data-tooltip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);font-size:.73rem;padding:.26rem .62rem;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:300}
.hdr-btn[data-tooltip]:hover::after{opacity:1}
.hdr-sep{width:1px;height:16px;background:rgba(255,255,255,0.12);margin:0 2px;flex-shrink:0}
html[data-theme="light"] .hdr-sep{background:rgba(0,0,0,0.12)}
.hdr-actions{display:flex;align-items:center;background:rgba(255,255,255,0.09);border-radius:99px;padding:7px;gap:12px}
html[data-theme="light"] .hdr-actions{background:rgba(0,0,0,0.03)}
@keyframes hdr-spin{to{transform:rotate(360deg)}}
.hdr-btn.spinning svg{animation:hdr-spin .7s linear infinite}
.nav-drawer{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:var(--card);border-right:1px solid rgba(255,255,255,.08);z-index:1000;transition:left .25s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column}
.nav-drawer.open{left:0}
.nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease}
.nav-backdrop.open{opacity:1;pointer-events:auto}
.nav-drawer-header{display:flex;align-items:center;gap:.75rem;padding:1.1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08)}
.nav-drawer-brand{font-weight:600;font-size:1rem;color:var(--text);flex:1}
.nav-drawer-footer{margin-top:auto;display:flex;align-items:center;gap:.5rem;padding:.7rem .75rem;border-top:1px solid rgba(255,255,255,.08)}
html[data-theme="light"] .nav-drawer-footer{border-top-color:rgba(0,0,0,.1)}
.nav-foot-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:38px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;padding:.4rem;font-family:inherit;font-size:.78rem;font-weight:700;letter-spacing:.04em;transition:border-color .15s,color .15s,background .15s}
.nav-foot-btn:hover{border-color:var(--teal);color:var(--text)}
.nav-menu{list-style:none;padding:.5rem 0;margin:0}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;cursor:pointer;font-size:.9rem;color:var(--text2);transition:background .15s,color .15s}.nav-item.nav-sub{padding-left:2.7rem;font-size:.8rem;gap:.55rem}.nav-item.nav-sub svg{width:14px;height:14px}.nav-item.nav-sub.nav-collapsed{display:none}.nav-acc-chevron{margin-left:auto;display:inline-flex;align-items:center;padding:2px;color:var(--text2);transition:transform .18s;border-radius:4px}.nav-acc-chevron:hover{background:rgba(35,209,180,.15);color:var(--teal)}.nav-acc-chevron.open{transform:rotate(180deg)}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
.nav-item.active{color:var(--teal);font-weight:500}
.nav-item.active svg{stroke:var(--teal)}
.novo-hdr{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 2rem;background:transparent;position:sticky;top:0;z-index:100;transition:background .25s,backdrop-filter .25s,box-shadow .25s}
.novo-hdr.scrolled{background:var(--hdr-glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1px 0 var(--border)}
.novo-theme-sun{display:block}.novo-theme-moon{display:none}
[data-theme="light"] .novo-theme-sun{display:none}[data-theme="light"] .novo-theme-moon{display:block}
.novo-lang-btn{width:auto !important;padding:0 9px;font-size:.71rem;font-weight:700;letter-spacing:.06em}
.novo-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:1rem;padding-bottom:2rem}
.novo-card{background:var(--card);border-radius:10px;padding:1.25rem 1.5rem}
.novo-card-header{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.novo-card-header h3{font-size:.88rem;font-weight:600;color:var(--text);margin:0;flex:1}
.novo-code-tag{display:none;align-items:center;font-size:.6rem;font-weight:700;letter-spacing:.04em;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--teal);background:rgba(58,184,183,.14);border:1px solid rgba(58,184,183,.32);border-radius:5px;padding:.05rem .32rem;line-height:1.35;flex-shrink:0}
.novo-info-btn{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text2);background:none;color:var(--text2);font-size:.62rem;font-style:normal;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:0;line-height:1}
body:not(.novo-info-on) .novo-card .novo-info-btn{display:none}
body.novo-info-on .novo-code-tag{display:inline-flex}
#novo-tip{position:fixed;z-index:9999;background:rgba(23,31,46,.78);backdrop-filter:blur(14px) saturate(1.5);border-radius:6px;padding:.45rem .7rem;width:278px;pointer-events:none;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
html[data-theme="light"] #novo-tip{background:rgba(246,248,250,.82)}
#novo-tip.nt-show{display:block}
#novo-tip .nt-text{font-size:.73rem;color:var(--text);font-weight:400;line-height:1.5}
#novo-tip .nt-code{font-size:.62rem;font-weight:700;color:var(--teal);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:.3rem;padding-top:.28rem;border-top:1px solid rgba(255,255,255,.12);letter-spacing:.07em}
html[data-theme="light"] #novo-tip .nt-code{border-top-color:rgba(0,0,0,.1)}
#view-novo{transition:filter .25s ease,margin-left .25s cubic-bezier(0.4,0,0.2,1)}
body.nav-docked #view-novo{margin-left:280px}
@media(max-width:820px){body.nav-docked #view-novo{margin-left:0}}
.content-blur{filter:blur(4px);pointer-events:none;user-select:none}
.section-hdr{grid-column:1/-1;margin:1.5rem 0 .25rem;border-top:1px solid var(--border);padding-top:1.25rem}
.section-hdr h2{font-size:.78rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin:0}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:.75rem}
.kpi-card{background:var(--card);border-radius:14px;padding:clamp(1rem,.6rem+1.3vw,1.6rem) clamp(1.05rem,.5rem+1.6vw,1.8rem);transition:box-shadow .18s}
.kpi-click{cursor:pointer}
.kpi-label{font-size:.66rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;line-height:1}
.kpi-value{font-size:clamp(1.35rem,.95rem+1.3vw,2rem);font-weight:800;line-height:1.1;margin:.35rem 0 .25rem}
.kpi-sub{font-size:.7rem;color:var(--muted);line-height:1.35}
/* Modal + tabela (estava ÓRFÃO depois do </html> — renderizava como texto; movido p/ dentro do style em 2026-07-29) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s linear;backdrop-filter:blur(5px)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:90vw;max-width:960px;max-height:85vh;display:flex;flex-direction:column;transform:translateY(20px);transition:transform .28s cubic-bezier(0.4,0,0.2,1)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.5rem;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1rem;font-weight:600;color:var(--text)}
.modal-close{background:none;border:none;color:var(--text2);font-size:1.4rem;cursor:pointer;padding:.2rem .5rem;border-radius:4px}
.modal-body{padding:1.2rem 1.5rem;overflow-y:auto;flex:1}
.btn-export{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:.3rem .7rem;font-size:.7rem;cursor:pointer;margin-left:auto}
table.lb{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.lb th{text-align:right;color:var(--teal);font-size:.72rem;font-weight:700;text-transform:uppercase;padding:.6rem 1rem;border-bottom:2px solid var(--teal);white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.lb th:first-child{text-align:left}
table.lb td{padding:.38rem 1rem;border-bottom:1px solid var(--border);color:var(--text);text-align:right}
table.lb td:first-child{text-align:left;font-weight:600}
table.lb tbody tr:nth-child(even) td{background:var(--even-s)}
</style>

<script>
(function(){ var s=localStorage.getItem('axenya_theme')||'dark'; if(s==='light') document.documentElement.setAttribute('data-theme','light'); })();
function toggleTheme(){ var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('axenya_theme',n); novoRender(); }
function doLogout(){ window.location.href='/login.html'; }
function _setNavOpen(open){ document.getElementById('nav-drawer').classList.toggle('open',open); document.body.classList.toggle('nav-docked',open); var narrow=window.matchMedia('(max-width:820px)').matches; document.getElementById('nav-backdrop').classList.toggle('open',open&&narrow); try{localStorage.setItem('novo_nav_open',open?'true':'false');}catch(e){} }
function closeDrawer(){ _setNavOpen(false); }
function toggleDrawer(){ _setNavOpen(!document.getElementById('nav-drawer').classList.contains('open')); }
function openModal(title,bodyHtml){ document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=bodyHtml; document.getElementById('modal-overlay').classList.add('open'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
function exportModalCSV(){ var title=document.getElementById('modal-title').textContent; var table=document.getElementById('modal-body').querySelector('table'); if(!table)return; var rows=[]; table.querySelectorAll('tr').forEach(function(tr){ var cells=[]; tr.querySelectorAll('th,td').forEach(function(c){ cells.push('"'+(c.textContent.trim().replace(/"/g,'""'))+'"'); }); rows.push(cells.join(',')); }); var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(rows.join('\n')); a.download=(title||'export').slice(0,40).replace(/[^a-z0-9]/gi,'-')+'-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); }

var NOVO_LANG=(function(){ try{return localStorage.getItem('novo_lang')||'pt';}catch(e){return 'pt';} })();
function novoToggleLang(){ NOVO_LANG=NOVO_LANG==='pt'?'en':'pt'; try{localStorage.setItem('novo_lang',NOVO_LANG);}catch(e){} (function(_e){if(_e)_e.textContent=NOVO_LANG.toUpperCase();})(document.getElementById('novo-lang-label')); novoRender(); }
var COT_CARD_CODES={'kpi-tickets':'Q01','kpi-open':'Q02','kpi-done':'Q03','kpi-cycle':'Q04','tk-stage':'Q05','tk-owner':'Q06','tk-month':'Q07','tk-aging':'Q08','kpi-cotacao':'Q09','cot-ae':'Q10','cot-vidas':'Q11'};
var _novoShowInfo=(function(){try{return localStorage.getItem('cotacao_show_info')!=='0';}catch(e){return true;}})();
function _codeTag(key){var c=COT_CARD_CODES[key]||'';return c?'<span class="novo-code-tag">'+c+'</span>':'';}
function novoToggleInfo(){_novoShowInfo=!_novoShowInfo;document.body.classList.toggle('novo-info-on',_novoShowInfo);var b=document.getElementById('btn-info-toggle');if(b)b.classList.toggle('highlighted',_novoShowInfo);try{localStorage.setItem('cotacao_show_info',_novoShowInfo?'1':'0');}catch(e){}}

document.addEventListener('mouseover',function(e){ var btn=e.target.closest('.novo-info-btn'); if(!btn)return; var tip=document.getElementById('novo-tip'); tip.querySelector('.nt-text').textContent=btn.getAttribute('data-tip')||''; tip.querySelector('.nt-code').textContent=btn.getAttribute('data-code')||''; tip.classList.add('nt-show'); });
document.addEventListener('mouseout',function(e){ if(!e.target.closest('.novo-info-btn')) document.getElementById('novo-tip').classList.remove('nt-show'); });
document.addEventListener('mousemove',function(e){ var tip=document.getElementById('novo-tip'); if(!tip.classList.contains('nt-show'))return; var r=tip.getBoundingClientRect(); var x=e.clientX+14; var y=e.clientY+14; if(x+r.width>window.innerWidth-8) x=e.clientX-r.width-10; if(y+r.height>window.innerHeight-8) y=e.clientY-r.height-10; tip.style.left=x+'px'; tip.style.top=y+'px'; });
function _infoBtn(tip,code){ var _ne=function(s){return (s==null?'—':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}; return _codeTag(code)+'<button class="novo-info-btn" data-tip="'+_ne(tip)+'" data-code="'+(COT_CARD_CODES[code]||code||'')+'" aria-label="info">i</button>'; }
window.addEventListener('scroll',function(){ document.getElementById('novo-hdr').classList.toggle('scrolled',window.scrollY>10); },{passive:true});

var NOVO_WON_STAGE='Ganho';
var NOVO_FONT='Inter,\'Segoe UI\',system-ui,sans-serif';
var _novoCharts={};
function _novoTheme(){ var isLight=document.documentElement.getAttribute('data-theme')==='light'; return { cText:isLight?'#1f2328':'#e6edf3', cText2:isLight?'#57606a':'#8b949e', cGrid:isLight?'rgba(0,0,0,.08)':'rgba(255,255,255,.06)', isLight:isLight }; }
function _novoMkChart(id,cfg){ var ctx=document.getElementById(id); if(!ctx)return; if(cfg&&cfg.options&&cfg.options.onClick&&!cfg.options.onHover){ cfg.options.onHover=function(e,els){ var t=e&&e.native&&e.native.target; if(t) t.style.cursor=(els&&els.length)?'pointer':''; }; } if(_novoCharts[id]) _novoCharts[id].destroy(); _novoCharts[id]=new Chart(ctx,cfg); }
var _ne=function(s){ return (s==null?'—':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
var _ni=function(v){ return v!=null?Number(v).toLocaleString('pt-BR'):'—'; };
function _annualRev(d){ if(d.arr_estimado!=null&&d.arr_estimado>0)return d.arr_estimado; if(d.primeira_fatura!=null&&d.primeira_fatura>0)return d.primeira_fatura*12; return 0; }
function _revShort(v){ if(!v||v<=0)return 'R$0'; return v>=1000000?('R$'+(v/1000000).toFixed(1)+'M'):('R$'+Math.round(v/1000)+'k'); }
function _mlbl(ym){ var p=ym.split('-'); return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(p[1])-1]+'/'+p[0].slice(2); }
function _dealsRows(deals){ return (deals||[]).map(function(d){ var hsUrl=d.hs_id?'https://app.hubspot.com/contacts/44715285/deal/'+d.hs_id:'#'; var name=d.hs_id?'<a href="'+hsUrl+'" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none">'+_ne(d.dealname)+'</a>':_ne(d.dealname); return '<tr><td style="text-align:left;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+name+'</td><td style="text-align:left;white-space:nowrap">'+_ne(d.ae)+'</td><td>'+_ne(d.pipeline)+'</td><td>'+_ne(d.stage)+'</td><td>'+_ni(d.vidas)+'</td><td>'+_revShort(_annualRev(d))+'</td><td>'+_ne(d.createdate)+'</td><td>'+_ne(d.data_prevista_para_receita)+'</td></tr>'; }).join(''); }
function novoOpenDealsModal(title,deals){ if(!deals||!deals.length){ openModal(title,'<p style="color:var(--text2);padding:1rem 0">Nenhum deal.</p>'); return; } openModal(title+' ('+deals.length+')','<table class="lb"><thead><tr><th style="text-align:left">Deal</th><th style="text-align:left">AE</th><th>Pipe</th><th>Etapa</th><th>Vidas</th><th>ARR</th><th>Criado</th><th>Dt. Receita</th></tr></thead><tbody>'+_dealsRows(deals)+'</tbody></table>'); }

// ── Pipeline de Cotação (TICKETS, id 847948895) ─────────────────────────────
// Fonte: POST /api/pull-tickets (fetchCotacaoTickets — endpoint que já existia do
// fluxo Electron; religado aqui em 2026-07-29, decisão do dono). Etapas: espelho de
// semantic/referencia.json → tickets_cotacao (o semantic-ref.js gerado não as expõe).
var COT_STAGES=[
  {id:'1262941018',nome:'Novas Cotações',open:true},
  {id:'1262941019',nome:'Triagem',open:true},
  {id:'1293302338',nome:'Pendente',open:true},
  {id:'1263003034',nome:'Mapeamento de Mercado',open:true},
  {id:'1263003035',nome:'Criação da Apresentação',open:true},
  {id:'1263003036',nome:'Projeto Entregue',open:false},
  {id:'1263003039',nome:'Concluído',open:false}
];
function _tkStage(t){ for(var i=0;i<COT_STAGES.length;i++){ if(COT_STAGES[i].id===String(t.hs_pipeline_stage)) return COT_STAGES[i]; } return {id:String(t.hs_pipeline_stage||''),nome:'(etapa removida)',open:false}; }
function _tkIsOpen(t){ return _tkStage(t).open; }
function _tkD10(v){ return v?String(v).substring(0,10):null; }
// hs_date_entered_* de TICKETS vem como epoch em ms (string numérica); createdate vem ISO.
function _tkTs(v){ if(v==null||v==='')return NaN; if(/^\d+$/.test(String(v)))return Number(v); return Date.parse(v); }
// Dias corridos entre criação e a 1ª entrada em etapa final (Projeto Entregue/Concluído)
function _tkCycleDays(t){
  var c=_tkTs(t.createdate); if(isNaN(c)) return null;
  var ends=[t['hs_date_entered_1263003036'],t['hs_date_entered_1263003039']].map(_tkTs).filter(function(n){return !isNaN(n);});
  if(!ends.length) return null;
  var d=Math.round((Math.min.apply(null,ends)-c)/86400000);
  return d<0?0:d;
}
function _tkAgeDays(t){ var c=_tkTs(t.createdate); if(isNaN(c))return null; var d=Math.round((Date.now()-c)/86400000); return d<0?0:d; }
function _tkOwner(t){ return (_tk&&_tk.owners&&_tk.owners[t.hubspot_owner_id])||( t.hubspot_owner_id?('ID '+t.hubspot_owner_id):'(sem responsável)'); }
function _tkRows(list,extraCol){
  return (list||[]).map(function(t){
    var id=t.hs_object_id||t._id;
    var url='https://app.hubspot.com/contacts/44715285/ticket/'+id;
    var name='<a href="'+url+'" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none">'+_ne(t.subject||('Ticket '+id))+'</a>';
    var extra = extraCol==='cycle' ? '<td>'+_ni(_tkCycleDays(t))+'</td>' : '<td>'+_ni(_tkAgeDays(t))+'</td>';
    return '<tr><td style="text-align:left;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+name+'</td><td style="text-align:left;white-space:nowrap">'+_ne(t._companyName||'—')+'</td><td style="text-align:left;white-space:nowrap">'+_ne(_tkOwner(t))+'</td><td style="text-align:left;white-space:nowrap">'+_ne(_tkStage(t).nome)+'</td><td style="white-space:nowrap">'+_ne(_tkD10(t.createdate))+'</td>'+extra+'</tr>';
  }).join('');
}
function cotOpenTicketsModal(title,list,extraCol){
  if(!list||!list.length){ openModal(title,'<p style="color:var(--text2);padding:1rem 0">Nenhum ticket.</p>'); return; }
  var sorted=list.slice().sort(function(a,b){ return (Date.parse(b.createdate)||0)-(Date.parse(a.createdate)||0); });
  openModal(title+' ('+list.length+')','<table class="lb"><thead><tr><th style="text-align:left">Ticket</th><th style="text-align:left">Empresa</th><th style="text-align:left">Responsável</th><th style="text-align:left">Etapa</th><th>Criado</th><th>'+(extraCol==='cycle'?'Dias de ciclo':'Dias em aberto')+'</th></tr></thead><tbody>'+_tkRows(sorted,extraCol)+'</tbody></table>');
}

var _deals=null,_tk=null;
function novoLoadData(){
  var btn=document.getElementById('btn-refresh'); if(btn) btn.classList.add('spinning');
  var pDeals=fetch('/api/forecast-table').then(function(r){ if(!r.ok) return r.text().then(function(txt){ throw new Error(txt||('HTTP '+r.status)); }); return r.json(); });
  var pTk=fetch('/api/pull-tickets',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(r){ return r.json(); }).catch(function(e){ return {success:false,error:String(e)}; });
  Promise.all([pDeals,pTk]).then(function(res){
    var data=res[0],tk=res[1];
    _deals=Array.isArray(data)?data:(data.deals||[]);window._dealsRaw=_deals;
    _tk=(tk&&tk.success&&tk.data)?tk.data:{tickets:[],owners:{},error:(tk&&tk.error)||'sem resposta'};
    if(btn) btn.classList.remove('spinning');
    novoRender();
  }).catch(function(err){
    if(btn) btn.classList.remove('spinning');
    document.getElementById('novo-content').innerHTML='<div style="text-align:center;padding:3rem 0;color:var(--red)">Erro: '+_ne(String(err))+'<br><br><button onclick="novoLoadData()" style="background:var(--teal);color:#fff;border:none;border-radius:8px;padding:.5rem 1.2rem;cursor:pointer">Tentar novamente</button></div>';
  });
}

function novoRender(){
  _deals=window._dealsRaw||_deals||[];
  var tickets=(_tk&&_tk.tickets)||[];
  var ts=new Date().toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
  var cotacao=(_deals||[]).filter(function(d){ var s=d.stage||''; return s.toLowerCase().indexOf('cota')>=0; });
  var abertos=tickets.filter(_tkIsOpen);
  var fechados=tickets.filter(function(t){return !_tkIsOpen(t);});
  var cycles=fechados.map(_tkCycleDays).filter(function(v){return v!=null;});
  var cycleAvg=cycles.length?Math.round(cycles.reduce(function(s,v){return s+v;},0)/cycles.length):null;

  var kpi=function(lbl,val,sub,col,key,kind){ return '<div class="kpi-card'+(kind?' kpi-click':'')+'" '+(kind?'onclick="cotKpiOpen(\''+kind+'\')"':'')+'><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.35rem"><div class="kpi-label">🟡 '+lbl+'</div>'+_codeTag(key)+'</div><div class="kpi-value" style="color:'+(col||'var(--text)')+'">'+val+'</div><div class="kpi-sub">'+sub+'</div></div>'; };
  var tkErr=_tk&&_tk.error?'<div style="background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.35);border-radius:8px;padding:.6rem .9rem;font-size:.8rem;color:var(--red);margin-bottom:1rem">Tickets indisponíveis: '+_ne(_tk.error)+'</div>':'';

  document.getElementById('novo-content').innerHTML=
    '<div style="font-size:.78rem;color:var(--text2);margin-bottom:1rem">Atualizado às '+ts+' | fonte: tickets do Pipeline de Cotação (id 847948895) via /api/pull-tickets | snapshot atual, sem filtro de período | 🟡 não validado contra o portal</div>'+
    tkErr+
    '<div class="kpi-row">'+
      kpi('Tickets no pipeline',_ni(tickets.length),'todos os tickets do Pipeline de Cotação','var(--teal)','kpi-tickets','tk-all')+
      kpi('Em aberto',_ni(abertos.length),'Novas Cotações | Triagem | Pendente | Mapeamento | Criação','var(--yellow)','kpi-open','tk-open')+
      kpi('Entregues | Concluídos',_ni(fechados.length),'Projeto Entregue + Concluído','var(--green)','kpi-done','tk-done')+
      kpi('Ciclo médio (dias)',cycleAvg!=null?_ni(cycleAvg):'—','criação → 1ª entrada em etapa final | '+_ni(cycles.length)+' tickets medidos','var(--text)','kpi-cycle','tk-cycle')+
    '</div>'+
    '<div class="novo-cards">'+
    '<div class="novo-card"><div class="novo-card-header"><h3>🟡 Tickets por etapa</h3>'+_infoBtn('Contagem de tickets do Pipeline de Cotação por etapa atual (hs_pipeline_stage). Snapshot, sem filtro de período. Clique numa barra para os tickets.','tk-stage')+'</div><canvas id="chart-tk-stage" style="max-height:300px"></canvas></div>'+
    '<div class="novo-card"><div class="novo-card-header"><h3>🟡 Tickets por responsável</h3>'+_infoBtn('Contagem por hubspot_owner_id (nome resolvido via owners). Snapshot atual. Clique numa barra para os tickets.','tk-owner')+'</div><canvas id="chart-tk-owner" style="max-height:300px"></canvas></div>'+
    '<div class="novo-card"><div class="novo-card-header"><h3>🟡 Volume por mês de criação</h3>'+_infoBtn('Tickets criados por mês (createdate), últimos 12 meses. Clique numa barra para os tickets do mês.','tk-month')+'</div><canvas id="chart-tk-month" style="max-height:300px"></canvas></div>'+
    '<div class="novo-card"><div class="novo-card-header"><h3>🟡 Aging dos abertos</h3>'+_infoBtn('Tickets EM ABERTO por faixa de dias desde a criação. Clique numa barra para os tickets da faixa.','tk-aging')+'</div><canvas id="chart-tk-aging" style="max-height:300px"></canvas></div>'+
    '<div class="section-hdr"><h2>Funil de Vendas | deals na etapa Cotação (proxy via /api/forecast-table — outra base: deals, não tickets)</h2></div>'+
    '<div class="novo-card"><div class="novo-card-header"><h3>Deals em Cotação por AE (proxy)</h3>'+_infoBtn('Snapshot atual: deals na etapa Cotação do funil de VENDAS por responsável. Não usa filtro de período.','cot-ae')+'</div><canvas id="chart-cot-ae" style="max-height:300px"></canvas></div>'+
    '<div class="novo-card"><div class="novo-card-header"><h3>Vidas em Cotação por AE (proxy)</h3>'+_infoBtn('Snapshot atual: vidas de deals na etapa Cotação do funil de VENDAS por AE. Não usa filtro de período.','cot-vidas')+'</div><canvas id="chart-cot-vidas" style="max-height:300px"></canvas></div>'+
    '</div>';

  buildTkStage();
  buildTkOwner();
  buildTkMonth();
  buildTkAging();
  buildCotAE();
  buildCotVidas();
}
function cotKpiOpen(kind){
  var tickets=(_tk&&_tk.tickets)||[];
  if(kind==='tk-all') cotOpenTicketsModal('Tickets no pipeline',tickets);
  else if(kind==='tk-open') cotOpenTicketsModal('Tickets em aberto',tickets.filter(_tkIsOpen));
  else if(kind==='tk-done') cotOpenTicketsModal('Entregues | Concluídos',tickets.filter(function(t){return !_tkIsOpen(t);}),'cycle');
  else if(kind==='tk-cycle') cotOpenTicketsModal('Ciclo | tickets em etapa final',tickets.filter(function(t){return !_tkIsOpen(t)&&_tkCycleDays(t)!=null;}),'cycle');
  else if(kind==='cotacao') novoOpenDealsModal('Em Cotação (proxy)', (_deals||[]).filter(function(d){return d.stage&&d.stage.toLowerCase().indexOf('cota')>=0;}));
}

function buildTkStage(){
  var th=_novoTheme(), tickets=(_tk&&_tk.tickets)||[];
  var counts=COT_STAGES.map(function(s){ return tickets.filter(function(t){return String(t.hs_pipeline_stage)===s.id;}).length; });
  var labels=COT_STAGES.map(function(s){return s.nome;});
  _novoMkChart('chart-tk-stage',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:labels,datasets:[{data:counts,backgroundColor:COT_STAGES.map(function(s){return s.open?'rgba(227,179,65,.75)':'rgba(63,185,80,.75)';}),borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,layout:{padding:{right:45}},plugins:{legend:{display:false},
      datalabels:{anchor:'end',align:'right',color:th.cText,font:{family:NOVO_FONT,size:11,weight:'bold'}},
      tooltip:{callbacks:{label:function(c){return c.parsed.x+' tickets';}}}},
      scales:{x:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT},precision:0}},y:{grid:{display:false},ticks:{color:th.cText,font:{family:NOVO_FONT}}}},
      onClick:function(e,el){ if(!el.length)return; var s=COT_STAGES[el[0].index]; cotOpenTicketsModal('Etapa | '+s.nome, tickets.filter(function(t){return String(t.hs_pipeline_stage)===s.id;}), s.open?null:'cycle'); }}});
}
function buildTkOwner(){
  var th=_novoTheme(), tickets=(_tk&&_tk.tickets)||[];
  var map={}; tickets.forEach(function(t){ var o=_tkOwner(t); map[o]=(map[o]||0)+1; });
  var labels=Object.keys(map).sort(function(a,b){return map[b]-map[a];}).slice(0,15);
  _novoMkChart('chart-tk-owner',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:labels,datasets:[{data:labels.map(function(l){return map[l];}),backgroundColor:'rgba(58,184,183,.75)',borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,layout:{padding:{right:45}},plugins:{legend:{display:false},
      datalabels:{anchor:'end',align:'right',color:th.cText,font:{family:NOVO_FONT,size:11,weight:'bold'}},
      tooltip:{callbacks:{label:function(c){return c.parsed.x+' tickets';}}}},
      scales:{x:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT},precision:0}},y:{grid:{display:false},ticks:{color:th.cText,font:{family:NOVO_FONT}}}},
      onClick:function(e,el){ if(!el.length)return; var o=labels[el[0].index]; cotOpenTicketsModal('Responsável | '+o, tickets.filter(function(t){return _tkOwner(t)===o;})); }}});
}
function buildTkMonth(){
  var th=_novoTheme(), tickets=(_tk&&_tk.tickets)||[];
  var map={}; tickets.forEach(function(t){ var ym=_tkD10(t.createdate); if(ym) { ym=ym.slice(0,7); map[ym]=(map[ym]||0)+1; } });
  var yms=Object.keys(map).sort().slice(-12);
  _novoMkChart('chart-tk-month',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:yms.map(_mlbl),datasets:[{data:yms.map(function(y){return map[y];}),backgroundColor:'rgba(88,166,255,.75)',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{display:false},
      datalabels:{anchor:'end',align:'top',color:th.cText,font:{family:NOVO_FONT,size:11,weight:'bold'}},
      tooltip:{callbacks:{label:function(c){return c.parsed.y+' tickets';}}}},
      scales:{x:{grid:{display:false},ticks:{color:th.cText2,font:{family:NOVO_FONT}}},y:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT},precision:0}}},
      onClick:function(e,el){ if(!el.length)return; var ym=yms[el[0].index]; cotOpenTicketsModal('Criados em '+_mlbl(ym), tickets.filter(function(t){var d=_tkD10(t.createdate);return d&&d.slice(0,7)===ym;})); }}});
}
var _TK_AGE_BUCKETS=[[0,7,'0–7d'],[8,14,'8–14d'],[15,30,'15–30d'],[31,60,'31–60d'],[61,Infinity,'60d+']];
function buildTkAging(){
  var th=_novoTheme(), abertos=((_tk&&_tk.tickets)||[]).filter(_tkIsOpen);
  var counts=_TK_AGE_BUCKETS.map(function(b){ return abertos.filter(function(t){var a=_tkAgeDays(t);return a!=null&&a>=b[0]&&a<=b[1];}).length; });
  _novoMkChart('chart-tk-aging',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:_TK_AGE_BUCKETS.map(function(b){return b[2];}),datasets:[{data:counts,backgroundColor:['rgba(63,185,80,.75)','rgba(58,184,183,.75)','rgba(227,179,65,.75)','rgba(210,153,34,.75)','rgba(248,81,73,.75)'],borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{display:false},
      datalabels:{anchor:'end',align:'top',color:th.cText,font:{family:NOVO_FONT,size:11,weight:'bold'}},
      tooltip:{callbacks:{label:function(c){return c.parsed.y+' tickets abertos';}}}},
      scales:{x:{grid:{display:false},ticks:{color:th.cText2,font:{family:NOVO_FONT}}},y:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT},precision:0}}},
      onClick:function(e,el){ if(!el.length)return; var b=_TK_AGE_BUCKETS[el[0].index]; cotOpenTicketsModal('Abertos | '+b[2], abertos.filter(function(t){var a=_tkAgeDays(t);return a!=null&&a>=b[0]&&a<=b[1];})); }}});
}

function buildCotAE(){
  var th=_novoTheme(), deals=_deals||[];
  var cotacao=deals.filter(function(d){return d.stage&&d.stage.toLowerCase().indexOf('cota')>=0;});
  var map={}; cotacao.forEach(function(d){var ae=d.ae||'(sem AE)'; map[ae]=(map[ae]||0)+1;});
  var labels=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
  var vals=labels.map(function(l){return map[l];});
  if(!labels.length){ document.getElementById('chart-cot-ae').parentElement.insertAdjacentHTML('beforeend','<p style="color:var(--text2);font-size:.8rem;padding:.5rem 0">Nenhum deal em etapa Cotação.</p>'); return; }
  _novoMkChart('chart-cot-ae',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:labels,datasets:[{data:vals,backgroundColor:'rgba(58,184,183,.75)',borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,layout:{padding:{right:45}},plugins:{legend:{display:false},
      datalabels:{anchor:'end',align:'right',color:th.cText,font:{family:NOVO_FONT,size:11,weight:'bold'}},
      tooltip:{callbacks:{label:function(c){return c.parsed.x+' deals';}}}},
      scales:{x:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT},precision:0}},y:{grid:{display:false},ticks:{color:th.cText,font:{family:NOVO_FONT}}}},
      onClick:function(e,el){ if(!el.length)return; var ae=labels[el[0].index]; novoOpenDealsModal('Cotação | '+ae, cotacao.filter(function(d){return (d.ae||'(sem AE)')===ae;})); }}});
}

function buildCotVidas(){
  var th=_novoTheme(), deals=_deals||[];
  var cotacao=deals.filter(function(d){return d.stage&&d.stage.toLowerCase().indexOf('cota')>=0;});
  var map={}; cotacao.forEach(function(d){var ae=d.ae||'(sem AE)'; map[ae]=(map[ae]||0)+(d.vidas||0);});
  var labels=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
  var vals=labels.map(function(l){return map[l];});
  if(!labels.length){ document.getElementById('chart-cot-vidas').parentElement.insertAdjacentHTML('beforeend','<p style="color:var(--text2);font-size:.8rem;padding:.5rem 0">Nenhum deal em etapa Cotação.</p>'); return; }
  _novoMkChart('chart-cot-vidas',{type:'bar',plugins:[ChartDataLabels],
    data:{labels:labels,datasets:[{data:vals,backgroundColor:'rgba(63,185,80,.75)',borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,layout:{padding:{right:65}},plugins:{legend:{display:false},
      datalabels:{anchor:'end',align:'right',color:th.cText,font:{family:NOVO_FONT,size:11,weight:'bold'},formatter:function(v){return _ni(v);}},
      tooltip:{callbacks:{label:function(c){return _ni(c.parsed.x)+' vidas';}}}},
      scales:{x:{grid:{color:th.cGrid},ticks:{color:th.cText2,font:{family:NOVO_FONT}}},y:{grid:{display:false},ticks:{color:th.cText,font:{family:NOVO_FONT}}}},
      onClick:function(e,el){ if(!el.length)return; var ae=labels[el[0].index]; novoOpenDealsModal('Vidas em Cotação | '+ae, cotacao.filter(function(d){return (d.ae||'(sem AE)')===ae;})); }}});
}

(function(){
  try{ if(localStorage.getItem('novo_nav_open')==='true') _setNavOpen(true); }catch(e){}
  (function(_e){if(_e)_e.textContent=NOVO_LANG.toUpperCase();})(document.getElementById('novo-lang-label'));
  document.body.classList.toggle('novo-info-on',_novoShowInfo);
  var _ib=document.getElementById('btn-info-toggle'); if(_ib)_ib.classList.toggle('highlighted',_novoShowInfo);
  novoLoadData();
})();
</script>
